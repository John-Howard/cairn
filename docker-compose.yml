services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://cairn:cairn@db:5432/cairn
      # For SSO (staging/prod): set AUTH_MODE=oidc and supply the three OIDC_*
      # values from the estate's secret store (see docs/admin-reference.md §1).
      AUTH_MODE: ${AUTH_MODE:-dev}
      SESSION_SECRET: ${SESSION_SECRET:-dev-secret-change-me}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      SESSION_IDLE_SECONDS: ${SESSION_IDLE_SECONDS:-3600}
      SESSION_ABSOLUTE_SECONDS: ${SESSION_ABSOLUTE_SECONDS:-43200}
      LOG_FORMAT: ${LOG_FORMAT:-}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cairn
      POSTGRES_PASSWORD: cairn
      POSTGRES_DB: cairn
    volumes:
      - cairn-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cairn -d cairn"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  cairn-db-data:
