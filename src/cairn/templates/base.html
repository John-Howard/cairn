<!doctype html>
<html lang="en" class="govuk-template">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Cairn{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/static/govuk/govuk-frontend-6.3.0.min.css">
  <link rel="shortcut icon" href="/assets/images/favicon.ico" type="image/x-icon">
</head>
<body class="govuk-template__body">
  <script src="/static/js-enabled.js"></script>
  <a href="#main-content" class="govuk-skip-link" data-module="govuk-skip-link">Skip to main content</a>
  <header class="govuk-header" data-module="govuk-header">
    <div class="govuk-header__container govuk-width-container">
      <div class="govuk-header__logo">
        <a href="/" class="govuk-header__link govuk-header__link--homepage">
          <span class="govuk-header__logotype-text">Cairn</span>
        </a>
      </div>
      {% if user %}
      <div class="govuk-header__content">
        <span class="govuk-header__link">{{ user.display_name }} ({{ user.role.value }})</span>
        <form method="post" action="/logout" style="display:inline">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <button type="submit" class="govuk-button govuk-button--secondary govuk-!-margin-left-2">Sign out</button>
        </form>
      </div>
      {% endif %}
    </div>
  </header>
  <div class="govuk-phase-banner govuk-width-container">
    <p class="govuk-phase-banner__content">
      <strong class="govuk-tag govuk-phase-banner__content__tag">alpha</strong>
      <span class="govuk-phase-banner__text">Cairn is in active development.</span>
    </p>
  </div>
  <div class="govuk-width-container">
    <main class="govuk-main-wrapper" id="main-content">
      {% block content %}{% endblock %}
    </main>
  </div>
  <footer class="govuk-footer">
    <div class="govuk-width-container">
      <span class="govuk-footer__meta-custom">Cairn — Record of Processing Activities</span>
    </div>
  </footer>
  <script type="module" src="/static/govuk-init.js"></script>
  <script src="/static/htmx.min.js"></script>
</body>
</html>
